<svg width="1584" height="396" viewBox="0 0 1584 396" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for subtle depth -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D0D0D"/>
      <stop offset="50%" style="stop-color:#111111"/>
      <stop offset="100%" style="stop-color:#0D0D0D"/>
    </linearGradient>

    <!-- Glow effect for nodes -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stronger glow for accent elements -->
    <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1584" height="396" fill="url(#bgGradient)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="99" x2="1584" y2="99" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="198" x2="1584" y2="198" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="297" x2="1584" y2="297" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="396" y1="0" x2="396" y2="396" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="792" y1="0" x2="792" y2="396" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="1188" y1="0" x2="1188" y2="396" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Particle network - left side (sparse) -->
  <g opacity="0.6">
    <!-- Nodes -->
    <circle cx="80" cy="120" r="2" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="150" cy="80" r="1.5" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="200" cy="180" r="2.5" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="120" cy="250" r="1.5" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="280" cy="140" r="2" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="320" cy="280" r="1.5" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="60" cy="320" r="2" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="240" cy="60" r="1.5" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="180" cy="340" r="2" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="350" cy="50" r="1.5" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="400" cy="200" r="2" fill="#FF6B35" filter="url(#glow)"/>

    <!-- Connections -->
    <line x1="80" y1="120" x2="150" y2="80" stroke="#FF6B35" stroke-width="0.5" opacity="0.3"/>
    <line x1="150" y1="80" x2="200" y2="180" stroke="#FF6B35" stroke-width="0.5" opacity="0.2"/>
    <line x1="80" y1="120" x2="200" y2="180" stroke="#FF6B35" stroke-width="0.5" opacity="0.25"/>
    <line x1="200" y1="180" x2="120" y2="250" stroke="#FF6B35" stroke-width="0.5" opacity="0.2"/>
    <line x1="200" y1="180" x2="280" y2="140" stroke="#FF6B35" stroke-width="0.5" opacity="0.3"/>
    <line x1="280" y1="140" x2="320" y2="280" stroke="#FF6B35" stroke-width="0.5" opacity="0.15"/>
    <line x1="120" y1="250" x2="60" y2="320" stroke="#FF6B35" stroke-width="0.5" opacity="0.2"/>
    <line x1="150" y1="80" x2="240" y2="60" stroke="#FF6B35" stroke-width="0.5" opacity="0.25"/>
    <line x1="240" y1="60" x2="280" y2="140" stroke="#FF6B35" stroke-width="0.5" opacity="0.2"/>
    <line x1="120" y1="250" x2="180" y2="340" stroke="#FF6B35" stroke-width="0.5" opacity="0.2"/>
    <line x1="240" y1="60" x2="350" y2="50" stroke="#FF6B35" stroke-width="0.5" opacity="0.15"/>
    <line x1="280" y1="140" x2="400" y2="200" stroke="#FF6B35" stroke-width="0.5" opacity="0.2"/>
    <line x1="320" y1="280" x2="400" y2="200" stroke="#FF6B35" stroke-width="0.5" opacity="0.15"/>
  </g>

  <!-- Particle network - right side (sparse) -->
  <g opacity="0.6">
    <!-- Nodes -->
    <circle cx="1500" cy="100" r="2" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="1420" cy="180" r="1.5" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="1350" cy="80" r="2.5" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="1480" cy="280" r="1.5" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="1300" cy="200" r="2" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="1380" cy="320" r="1.5" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="1520" cy="350" r="2" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="1250" cy="120" r="1.5" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="1200" cy="300" r="2" fill="#FF6B35" filter="url(#glow)"/>
    <circle cx="1280" cy="350" r="1.5" fill="#FF6B35" filter="url(#glow)"/>

    <!-- Connections -->
    <line x1="1500" y1="100" x2="1420" y2="180" stroke="#FF6B35" stroke-width="0.5" opacity="0.3"/>
    <line x1="1420" y1="180" x2="1350" y2="80" stroke="#FF6B35" stroke-width="0.5" opacity="0.2"/>
    <line x1="1500" y1="100" x2="1350" y2="80" stroke="#FF6B35" stroke-width="0.5" opacity="0.25"/>
    <line x1="1420" y1="180" x2="1480" y2="280" stroke="#FF6B35" stroke-width="0.5" opacity="0.2"/>
    <line x1="1420" y1="180" x2="1300" y2="200" stroke="#FF6B35" stroke-width="0.5" opacity="0.3"/>
    <line x1="1300" y1="200" x2="1380" y2="320" stroke="#FF6B35" stroke-width="0.5" opacity="0.15"/>
    <line x1="1480" y1="280" x2="1520" y2="350" stroke="#FF6B35" stroke-width="0.5" opacity="0.2"/>
    <line x1="1350" y1="80" x2="1250" y2="120" stroke="#FF6B35" stroke-width="0.5" opacity="0.25"/>
    <line x1="1250" y1="120" x2="1300" y2="200" stroke="#FF6B35" stroke-width="0.5" opacity="0.2"/>
    <line x1="1380" y1="320" x2="1520" y2="350" stroke="#FF6B35" stroke-width="0.5" opacity="0.2"/>
    <line x1="1300" y1="200" x2="1200" y2="300" stroke="#FF6B35" stroke-width="0.5" opacity="0.15"/>
    <line x1="1200" y1="300" x2="1280" y2="350" stroke="#FF6B35" stroke-width="0.5" opacity="0.2"/>
    <line x1="1380" y1="320" x2="1280" y2="350" stroke="#FF6B35" stroke-width="0.5" opacity="0.15"/>
  </g>

  <!-- Central content area -->
  <g>
    <!-- Tagline -->
    <text x="792" y="175"
          font-family="'Space Grotesk', -apple-system, sans-serif"
          font-size="32"
          font-weight="400"
          fill="#B3B3B3"
          text-anchor="middle"
          letter-spacing="0.02em">
      I make machines do the work.
    </text>

    <text x="792" y="225"
          font-family="'Space Grotesk', -apple-system, sans-serif"
          font-size="32"
          font-weight="400"
          fill="#FFFFFF"
          text-anchor="middle"
          letter-spacing="0.02em">
      So humans can do the <tspan fill="#FF6B35" font-weight="500">thinking</tspan>.
    </text>

    <!-- Accent line below -->
    <rect x="742" y="255" width="100" height="2" fill="#FF6B35" filter="url(#glowStrong)"/>
  </g>

  <!-- Subtle vignette overlay -->
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.4"/>
    </radialGradient>
  </defs>
  <rect width="1584" height="396" fill="url(#vignette)"/>
</svg>